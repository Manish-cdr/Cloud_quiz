{% extends "base.html" %}
{% block title %}Add Question — CloudQuiz{% endblock %}
{% block content %}
<div class="container" style="max-width:680px;">
    <div style="margin-bottom:2rem;">
        <a href="{{ url_for('admin_dashboard') }}" style="font-family:var(--mono);font-size:0.8rem;color:var(--muted);text-decoration:none;">← Dashboard</a>
        <h1 style="font-size:2rem;font-weight:800;margin-top:1rem;">Add Question</h1>
        <p class="text-muted mt-1">Add a new cloud computing question to the quiz bank</p>
    </div>

    <div class="card">
        <form method="POST">
            <div class="form-group">
                <label>Question Text</label>
                <textarea name="question_text" rows="3" required placeholder="e.g. What does IaaS stand for in cloud computing?"></textarea>
            </div>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
                <div class="form-group">
                    <label>Option A</label>
                    <input type="text" name="option_a" required placeholder="First option">
                </div>
                <div class="form-group">
                    <label>Option B</label>
                    <input type="text" name="option_b" required placeholder="Second option">
                </div>
                <div class="form-group">
                    <label>Option C</label>
                    <input type="text" name="option_c" required placeholder="Third option">
                </div>
                <div class="form-group">
                    <label>Option D</label>
                    <input type="text" name="option_d" required placeholder="Fourth option">
                </div>
            </div>

            <div class="form-group">
                <label>Correct Answer</label>
                <select name="correct_option" required>
                    <option value="">— Select correct option —</option>
                    <option value="A">A</option>
                    <option value="B">B</option>
                    <option value="C">C</option>
                    <option value="D">D</option>
                </select>
            </div>

            <div style="display:flex;gap:1rem;margin-top:0.5rem;">
                <button type="submit" class="btn btn-primary btn-lg" style="flex:1;justify-content:center;">
                    Save Question ✓
                </button>
                <a href="{{ url_for('admin_dashboard') }}" class="btn btn-ghost btn-lg">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
