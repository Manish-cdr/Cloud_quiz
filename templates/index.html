<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudQuiz — Cloud Computing Assessment</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0e1a;
            --surface: #111827;
            --card: #1a2235;
            --border: #1e3a5f;
            --accent: #00d4ff;
            --accent2: #7c3aed;
            --accent3: #10b981;
            --text: #e2e8f0;
            --muted: #64748b;
            --mono: 'Space Mono', monospace;
            --sans: 'Syne', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--sans);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated grid bg */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(0,212,255,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,212,255,0.04) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
        }
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 20% 20%, rgba(0,212,255,0.08) 0%, transparent 55%),
                radial-gradient(ellipse at 80% 80%, rgba(124,58,237,0.1) 0%, transparent 55%);
            pointer-events: none;
        }

        .hero {
            text-align: center;
            z-index: 1;
            animation: fadeUp 0.7s ease both;
        }
        @keyframes fadeUp {
            from { opacity:0; transform: translateY(24px); }
            to { opacity:1; transform: translateY(0); }
        }

        .logo {
            font-family: var(--mono);
            font-size: 0.85rem;
            color: var(--accent);
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .logo-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--accent);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%,100% { opacity:1; transform:scale(1); }
            50% { opacity:0.4; transform:scale(0.7); }
        }

        h1 {
            font-size: clamp(3rem, 8vw, 5.5rem);
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.03em;
            margin-bottom: 1rem;
        }
        h1 span { color: var(--accent); }
        .subtitle {
            color: var(--muted);
            font-size: 1.05rem;
            margin-bottom: 3rem;
            font-family: var(--mono);
            font-size: 0.9rem;
        }

        .cta-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.8rem 1.8rem;
            border-radius: 8px;
            font-family: var(--mono);
            font-size: 0.88rem;
            font-weight: 700;
            cursor: pointer;
            border: none;
            text-decoration: none;
            transition: all 0.2s;
            letter-spacing: 0.04em;
        }
        .btn-primary {
            background: var(--accent);
            color: #000;
        }
        .btn-primary:hover { background: #00b8d9; transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0,212,255,0.3); }
        .btn-ghost {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--border);
        }
        .btn-ghost:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-2px); }

        .chips {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
            margin-top: 3.5rem;
            flex-wrap: wrap;
        }
        .chip {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 0.4rem 0.9rem;
            border-radius: 20px;
            font-family: var(--mono);
            font-size: 0.72rem;
            color: var(--muted);
            letter-spacing: 0.06em;
        }
        .chip span { color: var(--accent3); margin-right: 0.3rem; }
    </style>
</head>
<body>
    <div class="hero">
        <div class="logo">
            <div class="logo-dot"></div>
            Cloud Computing Assessment System
        </div>
        <h1>Test Your<br><span>Cloud</span> IQ</h1>
        <p class="subtitle">// IaaS · PaaS · SaaS · DevOps · Architecture</p>
        <div class="cta-group">
            <a href="/login" class="btn btn-primary">→ Login</a>
            <a href="/register" class="btn btn-ghost">Register</a>
        </div>
        <div class="chips">
            <div class="chip"><span>✓</span> Timed Quizzes</div>
            <div class="chip"><span>✓</span> Instant Scoring</div>
            <div class="chip"><span>✓</span> Admin Panel</div>
            <div class="chip"><span>✓</span> Progress Tracking</div>
        </div>
    </div>
</body>
</html>
