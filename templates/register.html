{% extends "base.html" %}
{% block title %}Register — CloudQuiz{% endblock %}
{% block content %}
<div style="min-height:90vh;display:flex;align-items:center;justify-content:center;padding:2rem;">
<div style="width:100%;max-width:420px;">
    <div style="margin-bottom:2rem;">
        <a href="/" style="font-family:var(--mono);font-size:0.8rem;color:var(--muted);text-decoration:none;">← back</a>
        <h1 style="font-size:2rem;font-weight:800;margin-top:1rem;">Create account</h1>
        <p class="text-muted mt-1">Join the Cloud Computing Quiz platform</p>
    </div>

    <div class="card">
        <form method="POST">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" required placeholder="choose_a_username" autocomplete="username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required placeholder="min. 6 characters" autocomplete="new-password">
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" name="confirm_password" required placeholder="min. 6 characters" autocomplete="new-password">
            </div>
           
            <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:0.5rem;">
                Create Account →
            </button>
        </form>
        <p style="text-align:center;margin-top:1.25rem;font-size:0.85rem;color:var(--muted);">
            Already have an account? <a href="/login" style="color:var(--accent);text-decoration:none;">Login</a>
        </p>
    </div>
</div>
</div>
{% endblock %}
